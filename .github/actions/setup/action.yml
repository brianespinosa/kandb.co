# NOTE: This is a local composite action and requires the repository to have
# already been checked out before it is called (e.g. actions/checkout).
#
# NOTE: We do not use the built-in `cache: pnpm` option on actions/setup-node
# because v6 restricts automatic caching to npm only. pnpm caching is handled
# explicitly below. See docs/adr/002-github-actions-yarn-cache.md for details
# (superseded by ADR-004, which carries the same reasoning over to pnpm).

name: Setup
description: Enable corepack and install dependencies

runs:
  using: composite
  steps:
    - uses: actions/setup-node@v6.2.0
      with:
        node-version-file: .nvmrc

    - run: corepack enable
      shell: bash

    - name: Get pnpm store directory
      id: pnpm-cache-dir
      run: echo "dir=$(pnpm store path)" >> $GITHUB_OUTPUT
      shell: bash

    - uses: actions/cache@v5.0.3
      with:
        path: ${{ steps.pnpm-cache-dir.outputs.dir }}
        key: ${{ runner.os }}-pnpm-${{ hashFiles('**/pnpm-lock.yaml') }}
        restore-keys: |
          ${{ runner.os }}-pnpm-

    - run: pnpm install --frozen-lockfile
      shell: bash
